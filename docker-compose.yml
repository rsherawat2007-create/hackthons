services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: creatorhub
    ports:
      - "5432:5432"
    volumes:
      - creatorhub_pg:/var/lib/postgresql/data

volumes:
  creatorhub_pg:
